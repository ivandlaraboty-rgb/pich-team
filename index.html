html.light svg.ic{filter:drop-shadow(0 0 .6px rgba(70,40,25,.6))}

*{box-sizing:border-box}
.top .ttl b,.sec>summary,.stat b,.monthbar b,.sh-h .t b,.bigkassa b,.gate .brand,.ticket .cnt,.ticket .cl{font-family:var(--hfont,inherit)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:600 16px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:16px;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:560px;margin:0 auto;padding:0 12px}

/* шапка */
.top{display:flex;align-items:center;gap:12px;padding:14px 4px 10px}
.top .logo{width:46px;height:46px;flex:none}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:21px;font-weight:900;letter-spacing:.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;color:var(--muted);font-size:14px;font-weight:700}
.me-chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:var(--bw,2px) solid var(--tan);border-radius:var(--r-xl,999px);padding:4px 12px 4px 4px;max-width:52%}
.me-chip span.n{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ava{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:900;font-size:14px;color:#1f1915;background:var(--c,#ec9440)}
.ava.sm{width:24px;height:24px;font-size:12px}
.ava.lg{width:40px;height:40px;font-size:17px}
.demo-tag{font-size:11px;font-weight:900;letter-spacing:.1em;color:#1f1915;background:var(--gold);border-radius:var(--r-sm,6px);padding:1px 5px;margin-left:2px}

/* счётчики как в игре */
.stats{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:6px;align-items:center;background:var(--panel);border:var(--bw,2px) solid var(--line);border-radius:var(--r-xl,22px);padding:10px;margin:4px 0 14px}
.stat{text-align:center;padding:8px 4px;border-radius:var(--r-lg,16px);min-width:0}
.stat b{display:block;font-size:22px;font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px;line-height:1.2}
.stat.kassa{background:var(--green-bg)}
.stat.kassa b{color:var(--green)}
.stat.kassa small{color:var(--green-dim)}

/* панели-секции со сворачиванием */
.sec{background:var(--panel);border:var(--bw,2px) solid var(--line);border-radius:var(--r-xl,22px);margin:0 0 14px;padding:4px 16px 16px}
.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 0 8px;font-size:20px;font-weight:900;cursor:pointer;user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:'';width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:11px solid var(--text);transition:transform .15s;flex:none}
.sec:not([open])>summary::before{transform:rotate(-90deg)}
.sec:not([open]){padding-bottom:4px}
.sec>summary .em{font-size:22px}
.sec>summary .r{margin-left:auto;font-size:14px;color:var(--muted);font-weight:800}
.box{background:var(--panel2);border-radius:var(--r-lg,16px);padding:14px}
.note{color:var(--muted);font-size:14px;font-weight:600}
.hint{color:var(--dim);font-size:13px;font-weight:700}
h3{margin:14px 0 8px;font-size:15px;font-weight:900;color:var(--muted)}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:var(--r-xl,999px);background:var(--panel3);border:var(--bw,2px) solid var(--tan);color:var(--text);font-weight:900;font-size:16px;white-space:nowrap;transition:transform .08s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.green{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}
.btn.danger{background:transparent;border-color:var(--red-line);color:var(--red)}
.btn.wide{width:100%}
.btn.big{min-height:58px;font-size:19px}
.btn.sm{min-height:34px;padding:4px 12px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap-r{flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}
.mt{margin-top:12px}.mt2{margin-top:18px}

/* переключатели */
.seg{display:flex;background:var(--panel2);border-radius:var(--r-xl,999px);padding:3px;gap:2px}
.seg button{flex:1;min-height:36px;border-radius:var(--r-xl,999px);font-weight:800;font-size:14px;color:var(--muted);padding:0 10px}
.seg button.on{background:var(--panel3);color:var(--accent);box-shadow:inset 0 0 0 2px var(--tan)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;padding:4px 12px;border-radius:var(--r-xl,999px);background:var(--panel2);border:var(--bw,2px) solid var(--line);font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--sel-bg)}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 12px}
.monthbar b{font-size:18px;font-weight:900}
.arrow{width:40px;height:40px;border-radius:50%;background:var(--panel2);border:var(--bw,2px) solid var(--line);display:grid;place-items:center}
.arrow::before{content:'';border-top:7px solid transparent;border-bottom:7px solid transparent}
.arrow.l::before{border-right:10px solid var(--text);margin-right:3px}
.arrow.r::before{border-left:10px solid var(--text);margin-left:3px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;width:100%;text-align:left}
.tog+.tog{border-top:1px dashed var(--line)}
.sw{width:50px;height:30px;border-radius:var(--r-xl,999px);background:var(--panel3);border:var(--bw,2px) solid var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.tog.on .sw{background:var(--green-bg);border-color:var(--green-line)}
.tog.on .sw::after{transform:translateX(20px);background:var(--green)}

/* поля */
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:0 0 5px 4px}
.in{width:100%;min-height:46px;padding:10px 14px;border-radius:var(--r-md,14px);background:var(--panel2);border:var(--bw,2px) solid var(--line);font-weight:700;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.in:focus{border-color:var(--accent)}
textarea.in{min-height:84px;resize:vertical;line-height:1.35}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(-45deg,transparent 50%,var(--muted) 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
input[type=date].in,input[type=time].in,input[type=month].in{color-scheme:var(--scheme)}
.search{position:relative;margin-bottom:10px}
.search .in{padding-left:42px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:19px;pointer-events:none}
svg.ic{width:1em;height:1em;display:inline-block;vertical-align:-.16em;flex:none;overflow:visible}
.icon-pick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.icon-pick button{aspect-ratio:1;border-radius:var(--r-md,14px);background:var(--panel2);border:var(--bw,2px) solid var(--line);font-size:28px;display:grid;place-items:center}
.icon-pick button.on{border-color:var(--accent);background:var(--sel-bg)}

/* списки */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;width:100%;text-align:left}
.li+.li{border-top:1px solid var(--line)}
.li .main-t{flex:1;min-width:0}
.li .main-t b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .main-t small{display:block;color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .main-t small.wrap{white-space:normal}
.li .end{text-align:right;font-weight:900;white-space:nowrap}
.li .end small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.em-ico{font-size:22px;width:30px;text-align:center;flex:none}
.plus{color:var(--green)}.minus{color:var(--red)}
.badge{display:inline-block;font-size:12px;font-weight:900;padding:2px 8px;border-radius:var(--r-xl,999px);background:var(--panel3);color:var(--muted)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.gold{background:var(--gold-bg);color:var(--gold)}
.empty{text-align:center;padding:22px 8px;color:var(--muted)}
.empty .e{font-size:38px;display:block;margin-bottom:6px}

/* календарь */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:12px;font-weight:800;color:var(--dim);padding-bottom:2px;text-transform:lowercase}
.cal .wd.we{color:var(--we)}
.day{position:relative;aspect-ratio:1/1.12;border-radius:var(--r-md,12px);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px;min-width:0;overflow:hidden}
.day .dn{font-size:13px;font-weight:800;color:var(--muted);line-height:1.1}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.today .dn{color:var(--accent)}
.day.out{visibility:hidden}
.day .k{font-size:15px;line-height:1.2;margin-top:1px}
.day .h{font-size:12px;font-weight:900;line-height:1.1}
.day.morning{background:var(--k-morning)}.day.evening{background:var(--k-evening)}.day.full{background:var(--k-full)}.day.custom{background:var(--k-custom)}
.day .plan{color:var(--muted);font-weight:800}
.day .miss{position:absolute;top:2px;right:3px;font-size:11px}
.dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:3px;padding:0 1px}
.dot{width:15px;height:15px;border-radius:var(--r-sm,5px);font-size:9px;font-weight:900;display:grid;place-items:center;color:#1f1915;background:var(--c)}
.dot.pl{opacity:.5}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:13px;color:var(--muted);font-weight:700}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}

/* таблица как в Google-графике */
.tbl-wrap{overflow-x:auto;margin:0 -6px;padding:0 6px 4px}
table.tbl{border-collapse:separate;border-spacing:3px;font-size:13px}
.tbl th,.tbl td{min-width:34px;height:34px;text-align:center;border-radius:var(--r-sm,8px);font-weight:800;padding:0 2px}
.tbl thead th{color:var(--dim);font-size:11px;line-height:1.1;height:auto;padding:2px}
.tbl thead th b{display:block;color:var(--muted);font-size:13px}
.tbl thead th.today b{color:var(--accent)}
.tbl th.nm{position:sticky;left:0;z-index:1;background:var(--panel);text-align:left;min-width:74px;padding-left:4px;white-space:nowrap}
.tbl th.nm .ava{display:inline-grid;vertical-align:middle;margin-right:4px}
.tbl td{background:var(--panel2);cursor:pointer}
.tbl td.morning{background:var(--k-morning)}.tbl td.evening{background:var(--k-evening)}.tbl td.full{background:var(--k-full)}.tbl td.custom{background:var(--k-custom)}
.tbl td.pl{color:var(--muted)}
.tbl td.ms{color:var(--red)}
.tbl td.sum{background:none;color:var(--accent);cursor:default;min-width:44px}

/* смена: плитки */
.hrs-grid{display:grid;grid-template-columns:30px repeat(3,minmax(0,1fr));gap:6px;align-items:center}
.hrs-grid>span{font-size:12px;font-weight:800;color:var(--muted);text-align:center}
.hrs-grid>b{font-weight:900;color:var(--muted)}.hrs-grid>b.we{color:var(--we2)}
.hrs-grid .in{min-height:42px;padding:6px 4px;text-align:center;font-size:15px}
.hrs-grid .in::-webkit-calendar-picker-indicator{display:none}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kind{background:var(--panel2);border:var(--bw,2px) solid var(--line);border-radius:var(--r-lg,16px);padding:10px 12px;text-align:left;display:flex;align-items:center;gap:10px;min-height:58px}
.kind .em-ico{font-size:24px}
.kind b{display:block;font-weight:900}
.kind small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.kind.on{border-color:var(--accent);background:var(--sel-bg)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .v{flex:1;text-align:center}
.stepper .v input{width:100%;text-align:center;font-size:30px;font-weight:900;background:none;border:0;outline:none;color:var(--text)}
.stepper .v small{display:block;color:var(--muted);font-size:13px;font-weight:700}
.stepbtn{width:52px;height:52px;border-radius:50%;background:var(--panel3);border:var(--bw,2px) solid var(--tan);font-size:26px;font-weight:900;line-height:1}

/* зарплата */
.bigkassa{background:var(--green-bg);border-radius:var(--r-lg,18px);padding:16px;text-align:center}
.bigkassa b{display:block;font-size:36px;font-weight:1000;color:var(--green);line-height:1.1}
.bigkassa small{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green-dim);margin-top:4px}
.bar{height:16px;border-radius:var(--r-xl,999px);background:var(--bar-bg);border:var(--bw,2px) solid var(--bar-line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;border-radius:var(--r-xl,999px);background:linear-gradient(90deg,var(--bar-a),var(--accent));transition:width .4s}
.bar.thin{height:10px;margin:7px 0 0}
.paybar{display:flex;height:16px;border-radius:var(--r-xl,999px);overflow:hidden;background:var(--bar-bg);border:var(--bw,2px) solid var(--bar-line);margin:4px 0 8px}
.paybar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;font-weight:700;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.vbars{display:flex;align-items:flex-end;gap:3px;height:128px;padding-top:4px}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vb i{display:block;width:100%;min-height:3px;border-radius:var(--r-sm,6px) var(--r-sm,6px) 2px 2px;background:var(--accent);opacity:.42}
.vb.pk i{opacity:1}
.vb small{font-size:10px;font-weight:800;color:var(--dim);margin-top:4px;line-height:1}
.sales-li .main-t{white-space:normal}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.mini{background:var(--panel2);border-radius:var(--r-md,14px);padding:9px 6px;text-align:center;min-width:0}
.mini b{display:block;font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.warn{background:var(--red-bg);border:var(--bw,2px) solid var(--red-line);border-radius:var(--r-lg,16px);padding:12px 14px;color:var(--warn-text);font-weight:700;font-size:15px}
.warn b{color:var(--red)}
.okbox{background:var(--green-bg);border-radius:var(--r-lg,16px);padding:12px 14px;color:var(--green);font-weight:700}

/* ТТК */
.ttk-li .sz{display:flex;gap:3px;margin-top:3px}
.ttk-li .sz i{font-style:normal;font-size:11px;font-weight:900;padding:1px 6px;border-radius:var(--r-sm,6px);background:var(--panel3);color:var(--muted)}
.ttk-li .sz i.off{opacity:.3;text-decoration:line-through}
.ttk-li .tm{font-size:13px;color:var(--muted);font-weight:800;white-space:nowrap}
.ing{display:flex;flex-direction:column;gap:6px}
.ing div{display:flex;align-items:baseline;gap:10px;background:var(--panel2);border-radius:var(--r-md,12px);padding:9px 12px}
.ing .q{flex:none;min-width:58px;font-weight:1000;color:var(--accent);font-size:17px}
.ing .nm{font-weight:700}
.tech{background:var(--panel2);border-radius:var(--r-md,14px);padding:12px 14px;font-weight:600;line-height:1.5;white-space:pre-line}
.dname{font-size:26px;font-weight:1000;line-height:1.15;margin:2px 0 4px}

/* абонементы */
.ticket{display:flex;width:100%;text-align:left;background:var(--panel2);border-radius:var(--r-lg,18px);overflow:hidden;margin-bottom:10px;position:relative}
.ticket .stub{width:10px;flex:none;background:var(--c)}
.ticket .tb{flex:1;padding:12px 12px 12px 14px;min-width:0}
.ticket .tr{display:flex;align-items:flex-start;gap:8px}
.ticket .tr .grow{flex:1;min-width:0}
.ticket .num{font-size:12px;font-weight:900;color:var(--dim);letter-spacing:.06em}
.ticket .cl{font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket .ty{font-size:13px;color:var(--muted);font-weight:700}
.ticket .cnt{font-size:22px;font-weight:1000;white-space:nowrap}
.ticket .cnt small{font-size:14px;color:var(--muted)}
.ticket .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.ticket.off{opacity:.6}
.cups{display:flex;flex-wrap:wrap;gap:3px}
.cup{font-size:17px;line-height:1}
.cup.e{filter:grayscale(1);opacity:.22}
.cups.big{gap:8px;justify-content:center}
.cups.big .cup{font-size:34px}
.cup.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.float{position:fixed;pointer-events:none;font-size:30px;font-weight:1000;color:var(--gold);z-index:80;animation:fly 1s ease-out forwards;text-shadow:0 2px 0 #1f1915}
@keyframes fly{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-90px);opacity:0}}
.hist .li{padding:8px 2px}
.x{width:34px;height:34px;border-radius:50%;background:var(--panel3);border:var(--bw,2px) solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:900;color:var(--muted);flex:none}

/* нижние вкладки как в игре */
#tabs{flex:none;background:var(--panel);border-top:var(--bw,2px) solid var(--line);border-radius:var(--r-sheet,26px) var(--r-sheet,26px) 0 0;padding:6px 6px calc(6px + var(--sb))}
#tabs .in-t{max-width:560px;margin:0 auto;display:flex;gap:4px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 6px;border-radius:var(--r-lg,18px);color:var(--text);min-width:0}
.tab .ti{font-size:26px;line-height:1.15}
.tab .tl{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab.on{background:var(--panel3)}
.t5 .tab{padding-left:0;padding-right:0}
.t5 .tab .tl{font-size:11px;letter-spacing:-.02em}
.t5{gap:2px!important}
.tab.on .tl{color:var(--accent)}

/* шторка */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
#sheet .ov{position:absolute;inset:0;background:var(--overlay);animation:fade .18s}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--bg);border-top:var(--bw,2px) solid var(--line);border-radius:var(--r-sheet,28px) var(--r-sheet,28px) 0 0;padding:8px 16px calc(24px + var(--sb));animation:up .22s ease-out}
#sheet .pn .inner{max-width:560px;margin:0 auto}
#sheet .grab{width:44px;height:5px;border-radius:var(--r-sm,9px);background:var(--grab);margin:2px auto 8px}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh-h .t{flex:1;min-width:0}
.sh-h .t b{display:block;font-size:22px;font-weight:1000;line-height:1.15}
.sh-h .t small{display:block;color:var(--muted);font-weight:700;font-size:14px}
.close{width:42px;height:42px;border-radius:50%;background:var(--panel2);border:var(--bw,2px) solid var(--line);flex:none;position:relative}
.close::before,.close::after{content:'';position:absolute;left:50%;top:50%;width:18px;height:3px;border-radius:2px;background:var(--text);transform:translate(-50%,-50%) rotate(45deg)}
.close::after{transform:translate(-50%,-50%) rotate(-45deg)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media (min-width:760px){#sheet .pn{left:0;right:0;margin:0 auto;max-width:640px;border-left:var(--bw,2px) solid var(--line);border-right:var(--bw,2px) solid var(--line)}#tabs{max-width:640px;width:100%;margin:0 auto;border-left:var(--bw,2px) solid var(--line);border-right:var(--bw,2px) solid var(--line)}}
@keyframes fade{from{opacity:0}}

#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:var(--panel3);border:var(--bw,2px) solid var(--tan);border-radius:var(--r-lg,16px);padding:10px 16px;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fade .2s;text-align:center}
.toast.err{border-color:var(--red);color:var(--warn-text)}
.toast.ok{border-color:var(--green-line)}

/* экраны входа */
.gate{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px calc(40px + var(--sb))}
.gate .logo{width:132px;height:132px;margin-bottom:16px}
.gate .brand{font-size:34px;font-weight:1000;line-height:1.1;margin-bottom:6px}
.gate .tag{color:var(--muted);font-size:18px;font-weight:800;margin-bottom:22px}
.gate .sec{width:100%;max-width:420px;text-align:left;padding:18px}
.code-in{text-align:center;font-size:30px;font-weight:1000;letter-spacing:.3em;text-transform:uppercase}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.color-row{display:flex;flex-wrap:wrap;gap:8px}
.color-row button{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid transparent}
.color-row button.on{border-color:var(--text)}
.codebox{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);border-radius:var(--r-md,14px);padding:12px}
.codebox .row{flex:1 1 100%}
.codebox .row .btn{flex:1}
.codebox b{font-size:24px;font-weight:1000;letter-spacing:.2em;color:var(--gold)}
.sync-dot{position:fixed;right:10px;bottom:calc(86px + var(--sb));width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(230,166,64,.25);z-index:40;display:none}
.sync-dot.on{display:block;animation:fade .6s infinite alternate}
#dlg{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:24px}
#dlg.open{display:flex}
#dlg .dlg-ov{position:absolute;inset:0;background:var(--overlay);animation:fade .15s}
#dlg .dlg{position:relative;width:100%;max-width:380px;background:var(--panel);border:var(--bw,2px) solid var(--line);border-radius:var(--r-xl,24px);padding:18px;animation:fade .15s}
#dlg .dlg p{margin:0 0 16px;font-size:17px;font-weight:800;line-height:1.35}
.btn.danger-f{background:var(--red);border-color:var(--red);color:var(--on-red)}
.photo{display:block;width:100%;aspect-ratio:4/3;border-radius:var(--r-lg,18px);overflow:hidden;background:var(--panel2);margin:0 0 12px;position:relative;padding:0}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .spin{position:absolute;inset:0;margin:auto}
.photo-row{display:flex;gap:8px;margin:0 0 12px}
.photo-row label{cursor:pointer}
.ph-badge{display:inline-block;font-size:15px;margin-left:6px;vertical-align:-2px}
.pv{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px;z-index:75}
.pv img{max-width:100%;max-height:100%;object-fit:contain;border-radius:var(--r-md,12px)}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.theme{background:var(--panel2);border:var(--bw,2px) solid var(--line);border-radius:var(--r-lg,18px);padding:8px;text-align:left}
.theme.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tp{display:block;height:76px;border-radius:12px;padding:10px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25)}
.tp span{display:flex;align-items:center;gap:8px;height:100%;border-radius:var(--r-sm,10px);padding:0 10px}
.tp i{width:26px;height:26px;border-radius:50%;flex:none}
.tp em{height:8px;flex:1;border-radius:4px;opacity:.85}
.tp u{text-decoration:none;font-size:17px;font-weight:700;line-height:1;white-space:nowrap}
.theme b{display:block;margin:8px 4px 2px;font-weight:900}
.theme small{display:block;margin:0 4px 2px;color:var(--muted);font-size:12px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.stat b{font-size:18px}.tab .tl{font-size:11px}.tab .ti{font-size:23px}}
.in,.chip,.arrow,.sw,.close,.x,.kind,.icon-pick button,.theme{border-color:var(--ctl,var(--line))}
.chip.on,.kind.on,.icon-pick button.on,.theme.on{border-color:var(--accent)}.in:focus{border-color:var(--accent)}.tog.on .sw{border-color:var(--green-line)}
.demo-tag{color:var(--on-gold,#1f1915)}
.in::placeholder{color:var(--dim);opacity:1}
.dot.pl{opacity:1;background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--c)}
.ttk-li .sz i.off{opacity:1;color:var(--dim);background:transparent;box-shadow:inset 0 0 0 1px var(--ctl,var(--line));text-decoration:line-through}
html.light svg.ic{filter:drop-shadow(0 0 .45px #4a3020) drop-shadow(0 0 .45px #4a3020)}
.btn.main svg.ic{filter:drop-shadow(0 0 .5px var(--on-accent))}
html[data-theme=orbit] svg.ic{filter:drop-shadow(0 0 .5px #5a0f0a) drop-shadow(0 0 .5px #5a0f0a)}
</style>
</head>

<div id="sheet"></div>
<div id="toast"></div>
<div id="dlg"></div>
<div class="sync-dot" id="syncdot"></div>

  function rnd(n, abc) { var s = ''; for (var i = 0; i < n; i++) s += abc.charAt(Math.floor(Math.random() * abc.length)); return s; }
  function genId(prefix) { return (prefix || 'x') + Date.now().toString(36) + rnd(4, 'abcdefghijklmnopqrstuvwxyz0123456789'); }
  function genCode() { return rnd(6, CODE_ABC); }
  // Код приходит от того, кто нажал кнопку: так у админа на экране и на сервере один и тот же код.
  function pickCode(db, c) {

    if (m < 0) m += 24 * 60;
    return Math.round(m / 60 * 100) / 100;
  }

  return top + '<div class="stats">' + cells.map(function (c) { return '<div class="stat ' + (c[2] || '') + '"><b>' + c[0] + '</b><small>' + c[1] + '</small></div>'; }).join('') + '</div>';
}

// ===== График =====
function vSchedule() {
  var me = S.me, today = todayISO(), out = '';
  if (me.inSchedule !== false) {
    var mine = S.db.shifts.filter(function (s) { return s.staffId === me.id && s.date === today; });
    var b;
    if (mine.length) {
      b = mine.map(function (s) {
        var k = KIND[s.kind];
        return '<div class="li"><span class="em-ico">' + k.em + '</span><div class="main-t"><b>' + s.from + '–' + s.to + '</b><small class="wrap">' + esc(k.name) + ', ' + (s.hours != null ? 'вписано ' + hrs(s.hours) + '\u00a0ч' : 'по плану ' + hrs(C.plannedHours(s, S.db)) + '\u00a0ч') + '</small></div>' +
          '<button class="btn sm ' + (s.hours == null ? 'main' : '') + '" data-a="shiftEdit" data-id="' + s.id + '">' + (s.hours == null ? 'Вписать часы' : 'Изменить') + '</button></div>';
      }).join('');
    } else {
      b = '<div class="row"><div class="grow note">Сегодня смены нет.</div>' + (canEditShift(me.id, today) ? '<button class="btn sm" data-a="shiftNew" data-date="' + today + '">+ Я работаю</button>' : '') + '</div>';
    }
    var dh = C.dayHours(S.db, today);
    var rvToday = (mine.length || isAdmin()) ? revenueRows(today) : '';
    if (rvToday) b += '<div class="list" style="border-top:1px solid var(--line);margin-top:8px">' + rvToday + '</div>';
    var dueCh = (S.db.chores || []).filter(function (ch) { var cs = C.choreState(S.db, ch, today); return cs.due || cs.doneToday; });
    if (dueCh.length) b += '<div class="list" style="border-top:1px solid var(--line);margin-top:8px">' + dueCh.map(function (ch) { return choreRow(ch, true); }).join('') + '</div>';
    if (canCash() && (mine.length || isAdmin())) b += '<button class="btn sm wide mt" data-a="cashNew" data-v="out">' + I('camera') + (isAdmin() ? ' Пришла поставка или был расход' : ' Пришла поставка или закупка') + '</button>';
    out += sec('today', I('cup'), 'Сегодня', '<div class="box">' + b + '</div><div class="hint mt">Кофейня сегодня работает ' + dh.open + '–' + dh.close + '</div>', dayShort(today));
    var miss = sal(me.id, curMonth()).missing.concat(curMonth() !== monthShift(curMonth(), -1) ? sal(me.id, monthShift(curMonth(), -1)).missing : []);
    miss = miss.filter(function (s) { return canEditShift(me.id, s.date); });
    if (miss.length) {
      out += '<div class="warn" style="margin-bottom:14px">' + I('warn') + ' <b>Не вписаны часы</b> за ' + miss.map(function (s) { return '<button class="badge red" data-a="shiftEdit" data-id="' + s.id + '">' + dayShort(s.date) + '</button>'; }).join(' ') + '<div class="note" style="color:var(--warn-sub);margin-top:4px">Без часов смена не попадёт в зарплату.</div></div>';
    }
  }
  if (isAdmin() && reviewList().length) out += '<button class="warn" data-a="review" style="margin-bottom:14px;width:100%;text-align:left">' + I('warn') + ' <b>' + reviewList().length + ' ' + plural(reviewList().length, ['смена ждёт', 'смены ждут', 'смен ждут']) + ' проверки</b><div class="note" style="color:var(--warn-sub);margin-top:4px">Сотрудник поставил себе вторую смену за день. Нажми, чтобы подтвердить или удалить.</div></button>';
  var body = monthBar() + seg([['cal', 'Календарь'], ['table', 'Таблица']], S.calMode, 'calMode') + '<div class="mt"></div>';
  if (multi()) body += '<div class="chips">' + [{ id: 'all', name: 'Все точки' }].concat(places()).map(function (pl) { return '<button class="chip' + ((S.place || 'all') === pl.id ? ' on' : '') + '" data-a="placeFilter" data-v="' + pl.id + '">' + esc(pl.name) + '</button>'; }).join('') + '</div>';
  if (S.calMode === 'cal') {
    body += '<div class="chips">' + [['me', 'Мои смены'], ['all', 'Вся команда']].map(function (w) { return '<button class="chip' + (S.who === w[0] ? ' on' : '') + '" data-a="who" data-v="' + w[0] + '">' + w[1] + '</button>'; }).join('') + '</div>' + vCalendar();
  } else body += vTable();
  body += '<div class="legend"><span><i style="background:var(--k-morning)"></i>' + I('sun') + ' утро</span><span><i style="background:var(--k-evening)"></i>' + I('moon') + ' вечер</span><span><i style="background:var(--k-full)"></i>' + I('star') + ' фулл</span><span><i style="background:var(--k-custom)"></i>' + I('clock') + ' своё</span><span>' + I('warn') + ' нет часов</span></div>';
  if (S.me.inSchedule !== false) body += '<button class="btn sm wide mt" data-a="calendar">' + I('cal') + ' Смены в мой календарь</button>';
  var canAdd = isAdmin() || (me.inSchedule !== false && !C.isLocked(S.db, S.month));
  if (canAdd) body += '<button class="btn wide mt" data-a="shiftNew" data-date="' + (S.month === curMonth() ? today : S.month + '-01') + '">+ Добавить смену</button>';
  out += sec('cal', I('cal'), 'График', body);

  if (me.inSchedule !== false) {
    var next = S.db.shifts.filter(function (s) { return s.staffId === me.id && s.date > today; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; }).slice(0, 6);
    var nb = next.length ? '<div class="list">' + next.map(function (s) {
      var k = KIND[s.kind];
      return '<button class="li" data-a="shiftEdit" data-id="' + s.id + '"><span class="em-ico">' + k.em + '</span><div class="main-t"><b>' + esc(dayLong(s.date)) + '</b><small>' + esc(k.name) + ', ' + s.from + '–' + s.to + '</small></div><div class="end">' + hrs(C.plannedHours(s, S.db)) + '\u00a0ч</div></button>';
    }).join('') + '</div>' : '<div class="empty"><span class="e">' + I('cal') + '</span>Смен впереди нет. Добавь их в графике.</div>';
    out += sec('next', I('cal'), 'Мои ближайшие смены', nb);
  }
  if ((S.db.chores || []).length) out += sec('chores', I('spark'), 'Дела кофейни', '<div class="list">' + S.db.chores.map(function (ch) { return choreRow(ch, false); }).join('') + '</div>' + (isAdmin() ? '<div class="hint mt">Список дел и периодичность настраиваются во вкладке «Админ».</div>' : ''), S.db.chores.filter(function (ch) { return C.choreState(S.db, ch, todayISO()).due; }).length || '');
  return out;
}

function vCalendar() {
  var m = S.month, n = daysIn(m), first = dp(m + '-01').wd, today = todayISO(), me = S.me;
  var h = '<div class="cal">' + WD.map(function (w, i) { return '<div class="wd' + (i > 4 ? ' we' : '') + '">' + w + '</div>'; }).join('');
  for (var i = 0; i < first; i++) h += '<div class="day out"></div>';
  for (var d = 1; d <= n; d++) {
    var date = m + '-' + pad(d), list = shiftsOn(date), cls = 'day' + (date === today ? ' today' : ''), inner = '<span class="dn">' + d + '</span>';
    if (S.who === 'me') {
      var mine = list.filter(function (s) { return s.staffId === me.id; });
      if (mine.length) {
        var s = mine[0]; cls += ' ' + s.kind;
        var tot = 0, plan = false, miss = false;
        mine.forEach(function (x) { if (x.hours != null) tot += x.hours; else { tot += C.plannedHours(x, S.db); plan = true; if (x.date < today) miss = true; } });
        inner += '<span class="k">' + KIND[s.kind].em + '</span><span class="h' + (plan ? ' plan' : '') + '">' + hrs(tot) + '</span>' + (miss ? '<span class="miss">' + I('warn') + '</span>' : '');
      }
    } else if (list.length) {
      var anyMiss = false;
      inner += '<div class="dots">' + list.slice(0, 6).map(function (x) {
        var st = staff(x.staffId) || {}; if (x.hours == null && x.date < today) anyMiss = true;
        return '<span class="dot' + (x.hours == null ? ' pl' : '') + '" style="--c:' + esc(st.color || '#888') + '">' + initial(st.name) + '</span>';
      }).join('') + '</div>' + (anyMiss && isAdmin() ? '<span class="miss">' + I('warn') + '</span>' : '');
    }
    h += '<button class="' + cls + '" data-a="day" data-date="' + date + '">' + inner + '</button>';
  }
  return h + '</div>';
}

function vTable() {
  var m = S.month, n = daysIn(m), today = todayISO(), people = schedStaff(m);
  var h = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="nm"></th>';
  for (var d = 1; d <= n; d++) { var date = m + '-' + pad(d); h += '<th class="' + (date === today ? 'today' : '') + '">' + WD[dp(date).wd] + '<b>' + d + '</b></th>'; }
  h += '<th>Σ ч</th></tr></thead><tbody>';
  people.forEach(function (st) {
    h += '<tr><th class="nm">' + ava(st, 'sm') + ' ' + esc(st.name) + '</th>';
    for (var d = 1; d <= n; d++) {
      var date = m + '-' + pad(d);

      if (sh.length) {

}

// ===== Зарплата =====
function vPay() {
  if (isAdmin()) {
    var people = schedStaff(S.month), tot = { total: 0, payout: 0, toPay: 0, forecast: 0 };
    var rows = people.map(function (st) {
      var x = sal(st.id); tot.total += x.total; tot.payout += x.payout; tot.toPay += x.toPay; tot.forecast += x.forecast;

      '<div class="grid3"><div class="mini"><b>' + grp(tot.total) + '</b><small>начислено</small></div><div class="mini"><b>' + grp(tot.payout) + '</b><small>выдано</small></div><div class="mini"><b>' + grp(tot.forecast) + '</b><small>прогноз</small></div></div>';
    var revM = (S.db.revenue || []).filter(function (r) { return r.date.slice(0, 7) === S.month; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });

      (multi() ? '<div class="note mt">' + places().map(function (pl) { return esc(pl.name) + ': ' + money(revM.filter(function (r) { return r.placeId === pl.id; }).reduce(function (n, r) { return n + r.amount; }, 0)); }).join(' · ') + '</div>' : '') +
      (revM.length ? '<div class="list mt">' + revM.map(function (r) { return '<button class="li" data-a="revEdit" data-date="' + r.date + '" data-id="' + r.placeId + '"><span class="em-ico">' + I('cash') + '</span><div class="main-t"><b>' + dayShort(r.date) + '</b><small>' + (multi() ? esc(placeName(r.placeId)) + ', ' : '') + '' + (r.src === 'aqsi' ? '' : 'внёс ') + esc(revBy(r)) + '</small></div><div class="end">' + money(r.amount) + '</div></button>'; }).join('') + '</div>' : '<div class="empty">В этом месяце выручку ещё не вносили. Её вносят из графика: нажми на день.</div>') +
      ((C.aqsiOn(S.db) || MODE === 'demo') ? '<button class="btn wide mt" data-a="salesOpen">' + I('chart') + ' Продажи по позициям</button>' : '') +
      '<button class="btn wide mt" data-a="revEdit" data-date="' + todayISO() + '" data-id="' + places()[0].id + '">+ Внести или исправить выручку за любой день</button>', revTot ? money(revTot) : '');
    return sec('payteam', I('coin'), 'Зарплата команды', head + '<div class="list mt">' + (rows || '<div class="empty">В этом месяце смен нет.</div>') + '</div>' +
      '<button class="btn wide mt ' + (locked ? 'green' : '') + '" data-a="lockMonth" data-v="' + (locked ? 0 : 1) + '">' + (locked ? I('unlock') + ' Открыть месяц для правок' : I('lock') + ' Закрыть месяц') + '</button><div class="hint mt" style="text-align:center">В закрытом месяце бариста не могут менять свои часы.</div>') + revSec + cashSec();
  }
  return sec('paymine', I('coin'), 'Моя зарплата', monthBar() + payBlock(S.me.id, false)) + cashSec();

function payBlock(id, adminCtl) {

  var pct = x.forecast > 0 ? Math.min(100, Math.round(x.total / x.forecast * 100)) : 0;
  var h = '<div class="bigkassa"><b>' + money(x.toPay) + '</b><small>' + (x.toPay >= 0 ? 'к получению' : 'выдано больше начисленного') + '</small></div>';
  h += '<div class="mt"><div class="row"><span class="grow note">Начислено ' + money(x.total) + '</span><span class="note">прогноз ' + money(x.forecast) + '</span></div><div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="hint">Прогноз — если все запланированные смены отработать по плану.</div></div>';
  h += '<div class="grid3"><div class="mini"><b>' + hrs(x.hoursDone) + '</b><small>' + plural(x.hoursDone, F_HOURS) + '</small></div><div class="mini"><b>' + grp(x.rate) + '</b><small>₽ в час</small></div><div class="mini"><b>' + grp(x.earned) + '</b><small>за часы</small></div>' +
    '<div class="mini"><b class="' + (x.bonus ? 'plus' : '') + '">' + (x.bonus ? '+' : '') + grp(x.bonus) + '</b><small>премии</small></div><div class="mini"><b class="' + (x.fine ? 'minus' : '') + '">' + (x.fine ? '−' : '') + grp(x.fine) + '</b><small>вычеты</small></div><div class="mini"><b>' + grp(x.payout) + '</b><small>выдано</small></div></div>';
  if (showPct() && (x.pct || x.salesPay || x.pctTiered)) h += '<div class="box mt"><div class="row"><span class="em-ico">' + I('cash') + '</span><div class="grow"><b>Процент с продаж: ' + (x.salesPay ? '+' : '') + money(x.salesPay) + '</b><div class="hint">' + (x.pctTiered ? 'по шкале от часов смены, с ' : pctStr(x.pct) + '% от ') + money(x.salesBase) + (S.db.settings.pctSplit === 'full' ? ' выручки в дни смен' : ' — твоей доли выручки') + '</div></div></div></div>';
  if (x.multExtra) h += '<div class="note mt">' + I('star') + ' В «за часы» входит доплата за повышенную ставку: +' + money(x.multExtra) + '</div>';
  if (x.review.length) h += '<div class="warn mt">' + I('warn') + ' <b>На проверке у админа:</b> ' + x.review.map(function (s) { return dayShort(s.date); }).join(', ') + '. Вторая смена за день не считается, пока админ её не подтвердит.</div>';
  if (x.missing.length) h += '<div class="warn mt">' + I('warn') + ' <b>Нет часов</b> за ' + x.missing.map(function (s) { return dayShort(s.date); }).join(', ') + '. Эти смены пока не считаются.</div>';
  if (adminCtl) h += '<div class="row mt"><button class="btn grow green sm" data-a="moneyNew" data-type="bonus" data-id="' + id + '">' + I('gift') + ' Премия</button><button class="btn grow sm" data-a="moneyNew" data-type="fine" data-id="' + id + '">' + I('minus') + ' Вычет</button><button class="btn grow main sm" data-a="moneyNew" data-type="payout" data-id="' + id + '">' + I('cash') + ' Выдать</button></div>';
  if (x.money.length) {
    h += '<h3>Премии, вычеты и выплаты</h3><div class="list">' + x.money.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).map(function (m) {
      var t = { bonus: [I('gift'), 'Премия', 'plus', '+'], fine: [I('minus'), 'Вычет', 'minus', '−'], payout: [I('cash'), 'Выплата', '', ''] }[m.type];
      var inner = '<span class="em-ico">' + t[0] + '</span><div class="main-t"><b>' + esc(m.note || t[1]) + '</b><small>' + t[1] + ', ' + dayShort(m.date) + '</small></div><div class="end ' + t[2] + '">' + t[3] + money(m.amount) + '</div>';
      return adminCtl ? '<button class="li" data-a="moneyEdit" data-id="' + m.id + '">' + inner + '</button>' : '<div class="li">' + inner + '</div>';
    }).join('') + '</div>';
  }
  if (x.shifts.length) {
    h += '<h3>Смены</h3><div class="list">' + x.shifts.map(function (s) {
      var k = KIND[s.kind], dd = dp(s.date), done = s.hours != null;
      var right = s.check ? '<div class="end" style="color:var(--muted)">—<small>на проверке</small></div>' : done ? '<div class="end">' + money(s.hours * x.rate * C.multOf(s)) + '<small>' + hrs(s.hours) + '\u00a0ч</small></div>' : '<div class="end" style="color:var(--muted)">~' + money(C.plannedHours(s, S.db) * x.rate) + '<small>' + (s.date < today ? I('warn') + ' нет часов' : 'план ' + hrs(C.plannedHours(s, S.db)) + '\u00a0ч') + '</small></div>';
      return '<button class="li" data-a="shiftEdit" data-id="' + s.id + '"><span class="em-ico">' + k.em + '</span><div class="main-t"><b>' + WD[dd.wd] + ', ' + dd.d + ' ' + MONTHS_G[dd.m - 1] + '</b><small class="wrap">' + s.from + '–' + s.to + (s.note ? ', ' + esc(s.note) : '') + shiftTags(s) + '</small></div>' + right + '</button>';
    }).join('') + '</div>';
  } else h += '<div class="empty"><span class="e">' + I('cal') + '</span>В этом месяце смен нет.</div>';
  return h;

// ===== ТТК =====

  h += '<div class="chips"><button class="chip' + (S.ttkCat === 'all' ? ' on' : '') + '" data-a="ttkCat" data-v="all">Все</button>' + cats.map(function (c) {

function ttkMatch(t, q) {
  if (!q) return true;
  var hay = (t.name + ' ' + t.sizes.s250 + ' ' + t.sizes.s350 + ' ' + t.sizes.s450 + ' ' + t.composition).toLowerCase().replace(/ё/g, 'е');
  return q.toLowerCase().replace(/ё/g, 'е').split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
}
function ttkList() {
  var q = S.ttkQ.trim(), out = '';

function showGate(kind, msg) {
  document.getElementById('tabs').innerHTML = ''; document.getElementById('tabs').style.display = 'none';
  var h = '<div class="gate">' + logo() + '<div class="brand">ПИЧ Команда</div><div class="tag">мини-приложение для команды кофейни</div>';
  if (kind === 'loading') h += '<div class="spin"></div><div class="note">Загружаю данные…</div>';
  else if (kind === 'code') h += '<div class="sec"><b style="font-size:20px">Вход в команду</b><p class="note">Введи код, который тебе прислал админ. Это нужно сделать один раз.</p><input class="in code-in" id="code" maxlength="8" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="••••••"><button class="btn main wide big mt" data-a="claim">Войти</button><div class="note mt" id="code-err" style="color:var(--red)"></div></div>';
  else if (kind === 'web') h += '<div class="sec"><b style="font-size:20px">Вход в веб-версию</b><p class="note">Открой «' + esc(document.title) + '» в Telegram, нажми на своё имя вверху → «Веб-версия» и получи код. Он действует 10 минут.</p>' + (msg ? '<div class="warn" style="margin-bottom:12px">' + esc(msg) + '</div>' : '') + '<input class="in" id="wcode" placeholder="XXXX-XXXX" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="12" style="text-align:center;font-size:22px;letter-spacing:.12em;font-weight:800"><div class="err" id="wcode-err" style="color:var(--red);min-height:20px;margin:6px 0"></div><button class="btn main wide big" data-a="webLogin">Войти</button><p class="hint mt">Сотрудник ещё не в команде? Сначала войди в приложение в Telegram по коду от админа.</p></div>';
  else if (kind === 'outside') h += '<div class="sec"><b style="font-size:20px">Открой через Telegram</b><p class="note">Приложение узнаёт сотрудника по Telegram-аккаунту, поэтому работает только внутри бота.</p>' + (appLink() ? '<a class="btn main wide" href="' + esc(appLink()) + '">Открыть в Telegram</a>' : '') + '</div>';
  else h += '<div class="sec"><b style="font-size:20px">Не получилось загрузить</b><p class="note">' + esc(msg || '') + '</p><button class="btn main wide" data-a="retry">Повторить</button></div>';
  document.getElementById('main').innerHTML = h + '</div>';
  if (kind === 'code' && !triedStart && startCode()) { triedStart = true; document.getElementById('code').value = startCode(); H.claim(); }
}

function webLost() { WebAuth.clear(); showGate('web', 'Вход в веб-версию завершён. Получи новый код в Telegram.'); }
function webLoginWith(code) {
  var err = document.getElementById('wcode-err'), btn = document.querySelector('[data-a=webLogin]');
  if (err) err.textContent = ''; if (btn) btn.disabled = true;
  Remote.call({ op: 'web.login', code: code, label: deviceLabel() }).then(function (j) {
    WebAuth.save(j.session, j.sid); document.getElementById('tabs').style.display = '';
    setData(j.view, j.rev); renderAll(); toast('Привет, ' + S.me.name + '!', 'ok'); startPolling();
  }, function (e) { if (!document.getElementById('wcode')) showGate('web'); var er = document.getElementById('wcode-err'); if (er) er.textContent = e.message; var b = document.querySelector('[data-a=webLogin]'); if (b) b.disabled = false; });
}
H.webLogin = function () { var c = document.getElementById('wcode').value.replace(/[^A-Za-z0-9]/g, ''); if (c.length < 8) { document.getElementById('wcode-err').textContent = 'В коде 8 знаков'; return; } webLoginWith(c); };
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target && e.target.id === 'wcode') H.webLogin(); });
H.claim = function () {
  var code = document.getElementById('code').value.replace(/[^A-Za-z0-9]/g, ''), err = document.getElementById('code-err');
  err.textContent = '';
  Remote.call({ op: 'claim', code: code }).then(function (j) { haptic('ok'); document.getElementById('tabs').style.display = ''; setData(j.view, j.rev); renderAll(); toast('Привет, ' + S.me.name + '!', 'ok'); startPolling(); }, function (e) { haptic('error'); err.textContent = e.message; });
};

function setupTelegram() {
  if (!TGW) return;
  try { TGW.ready(); TGW.expand(); } catch (e) {}

  try { TGW.disableVerticalSwipes && TGW.disableVerticalSwipes(); } catch (e) {}
  try { TGW.BackButton.onClick(function () { if (S.sheet && S.sheet.args && S.sheet.args.back) back(); else closeSheet(); }); } catch (e) {}
}

function boot() {
  setupTelegram();
  applyTheme(curTheme());
  if (MODE === 'web') {
    var lm = /[#&]login=([A-Za-z0-9-]{8,12})/.exec(location.hash || '');
    if (lm) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} showGate('web'); document.getElementById('wcode').value = lm[1]; webLoginWith(lm[1]); return; }
    if (!WebAuth.key()) { showGate('web'); return; }
  }
  if (MODE === 'demo') {
    Demo.init(); setData(Demo.view()); document.getElementById('tabs').style.display = ''; renderAll();
    var seen = false; try { seen = !!localStorage.getItem('pich_demo_hint'); localStorage.setItem('pich_demo_hint', '1'); } catch (e) {}
    if (!seen) setTimeout(function () { toast('Это демо: данные вымышленные и хранятся только на этом устройстве. Нажми на имя справа вверху, чтобы посмотреть глазами бариста.', 'ok', 7000); }, 600);
    return;
  }
  showGate('loading');
  Remote.call({ op: 'boot' }).then(function (j) {
    if (j.needCode) { showGate('code'); return; }
    if (j.needLogin) { webLost(); return; }
    document.getElementById('tabs').style.display = '';
    setData(j.view, j.rev); renderAll(); startPolling();
  }, function (e) { showGate('error', e.message); });
}
boot();
</script>
